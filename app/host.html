<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat with your host · Maître d’</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f2e9;color:#27372e;font:15px system-ui,sans-serif}a{color:inherit}header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px max(20px,calc((100vw - 880px)/2));border-bottom:1px solid #dedfd2}.brand{font:29px Georgia,serif;text-decoration:none;white-space:nowrap}.toplink{font-size:13px}main{width:min(880px,100% - 32px);margin:28px auto}.chat{background:#fffdf7;border:1px solid #dadfd2;border-radius:23px;overflow:hidden;box-shadow:0 18px 46px #23382812}.chat-head{background:#263e33;color:#fff;display:flex;align-items:center;gap:15px;padding:20px 24px}.avatar{display:grid;place-items:center;background:#e8e7c5;color:#263e33;width:46px;height:46px;border-radius:50%;flex:none;font:italic 28px Georgia,serif}.identity{flex:1}.identity h1{font:25px Georgia,serif;margin:0 0 4px}.identity p{margin:0;font-size:12px;color:#e0eadd}.messages{min-height:230px;max-height:49vh;overflow:auto;display:flex;flex-direction:column;gap:15px;padding:25px}.message{align-self:flex-start;max-width:87%;padding:13px 17px;background:#eaf0e5;border-radius:4px 17px 17px 17px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}.message.guest{align-self:flex-end;background:#345a48;color:white;border-radius:17px 4px 17px 17px}.message small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:1px;margin-bottom:3px}.suggestions,.voice-options,.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.suggestions{padding:0 24px 12px}.composer{padding:16px 24px;border-top:1px solid #e2e5da}.input-row{display:flex;gap:9px;align-items:flex-end}textarea{width:100%;min-height:62px;max-height:180px;border:1px solid #bfcbbd;background:#fffefa;border-radius:13px;font:inherit;padding:13px;resize:vertical;color:inherit}button{font:inherit;border:0;border-radius:10px;padding:10px 13px;background:#345a48;color:#fff;cursor:pointer}button:disabled{opacity:.55;cursor:default}button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid #a96731;outline-offset:3px}.secondary{background:#e9eee3;color:#293b2f}.chat-head button{background:#ffffff20;color:#fff}.suggestions button,.voice-options button,.chat-head button{font-size:12px}#mic{white-space:nowrap;background:#e6ebda;color:#263e33}#mic[aria-pressed=true]{background:#a63b31;color:#fff}#send{white-space:nowrap}.review{align-self:flex-start;max-width:100%;border:1px solid #d7dfcf;background:#f7f9ef;border-radius:13px;padding:15px}.review h2{font:20px Georgia,serif;margin:0 0 7px}.review dl{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;margin:8px 0 12px}.review dt{color:#516255}.review dd{margin:0;overflow-wrap:anywhere}.caption{font-size:12px;color:#526257;line-height:1.5;margin:8px 0}.voice-options{margin-top:10px;font-size:12px}.error{color:#a03424}.hidden{display:none!important}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}code{overflow-wrap:anywhere}@media(max-width:560px){main{width:calc(100% - 16px);margin:10px auto}.chat-head,.composer,.messages{padding:14px}.suggestions{padding:0 14px 10px}.input-row{flex-wrap:wrap}.input-row textarea{flex-basis:100%}.input-row button{flex:1}.messages{max-height:45vh}.message{max-width:95%}}
</style>
</head>
<body>
<header><a class="brand" href="/">maître d’.</a><a class="toplink" href="/quality">Speech-quality lab ↗</a></header>
<main><section class="chat" aria-label="Reservation chat">
<div class="chat-head"><span class="avatar" aria-hidden="true">J</span><div class="identity"><h1>Juniper &amp; Rye</h1><p id="mode">Reservation chat · Fictional restaurant</p></div><button id="restart" type="button">New chat</button></div>
<div id="messages" class="messages" role="log" aria-live="polite" aria-label="Conversation"></div>
<div id="suggestions" class="suggestions" aria-label="Suggested messages">
<button class="secondary" type="button" data-prompt="A table for four tomorrow at 6:30 pm">Book for four tomorrow</button>
<button class="secondary" type="button" data-prompt="A table for two next Friday">Ask about Friday</button>
<button class="secondary" type="button" data-prompt="I’d like to speak to a human">Ask for staff</button>
</div>
<div class="composer">
<form id="form"><label for="message" class="sr-only">Your message</label>
<div class="input-row"><textarea id="message" maxlength="1000" required placeholder="Type a message or use the microphone…"></textarea><button id="mic" type="button" aria-pressed="false">🎙 Start microphone</button><button id="send" type="submit">Send ↑</button></div>
</form>
<p id="voice-help" class="caption">Speak, then review your transcript before sending. Your browser may process microphone audio through its speech service. Use fictional details.</p>
<div class="voice-options"><button id="read" type="button" class="secondary">Read reply</button><button id="silence" type="button" class="secondary">Stop audio</button><label><input id="auto-read" type="checkbox"> Read replies aloud</label><button id="retry" type="button" class="secondary hidden">Retry last request</button></div>
<div id="voice-status" class="caption" role="status"></div><div id="status" class="caption" role="status"></div>
</div></section></main>
<template id="review-template"><section class="review hidden" id="review"><div id="review-draft"><h2>Review your reservation</h2><dl id="draft"></dl><p class="caption">New York time. Send or clear any unsent message before confirming.</p><button id="confirm" type="button">Confirm reservation</button></div><div id="receipt" class="hidden"><h2>Your table is confirmed</h2><p class="caption">Save this code. To cancel, use the <a href="/">reservation studio</a>.</p><code id="code"></code></div></section></template>
<script type="module">
import {createVoice} from '/assets/voice.mjs';
const $=id=>document.getElementById(id);const review=$('review-template').content.firstElementChild;let state=null,pending=null,busy=false,phase='idle';
const voice=createVoice(window,{
  onTranscript:text=>{const box=$('message');box.value=[box.value.trim(),text].filter(Boolean).join(' ').slice(0,1000);controls()},
  onStatus:(message,error=false)=>{$('voice-status').textContent=message;$('voice-status').classList.toggle('error',error)},
  onPhase:next=>{phase=next;controls()}
});
if(!voice.canListen)$('voice-help').textContent='Microphone transcription is unavailable in this browser. You can still type.';
if(!voice.canSpeak){for(const id of ['read','silence','auto-read'])$(id).disabled=true}
$('mic').onclick=()=>{if(phase==='listening')voice.stop();else if(phase==='idle')voice.start()};
function readReply(){
  const latest=state?.messages.at(-1);
  if(latest?.role==='host')voice.speak(state.receipt?'Your table is confirmed. Your confirmation code is displayed on screen.':latest.text);
}
$('read').onclick=readReply;
$('silence').onclick=voice.silence;
$('auto-read').onchange=()=>{if($('auto-read').checked)readReply();else voice.silence()};
$('message').oninput=controls;
window.addEventListener('pagehide',()=>{voice.abort();voice.silence()});
const savedKey='maitre-host-session',pendingKey='maitre-host-pending';
function status(message,error=false){$('status').textContent=message;$('status').classList.toggle('error',error)}
function controls(){const blocked=busy||!!pending||phase!=='idle';for(const chip of $('suggestions').querySelectorAll('button'))chip.disabled=blocked||!state;for(const id of ['send','restart','confirm','message'])$(id).disabled=blocked;
$('confirm').disabled=blocked||!!$('message').value.trim();$('mic').disabled=!voice.canListen||!state||busy||!!pending||phase==='finishing'||['booked','handoff'].includes(state.status);
$('mic').textContent=phase==='listening'?'Stop microphone':phase==='finishing'?'Finishing…':'🎙 Start microphone';$('mic').setAttribute('aria-pressed',String(phase==='listening'));if(voice.canSpeak){$('read').disabled=!state||phase!=='idle';$('auto-read').disabled=phase!=='idle';}$('retry').classList.toggle('hidden',!pending);$('retry').disabled=busy}
async function api(path,options){const response=await fetch(path,options);const body=await response.json();if(!response.ok){const error=Error(typeof body.detail==='string'?body.detail:'Please check your message.');error.definite=true;throw error}return body}
function render(next){state=next;$('mode').textContent=state.provider==='ollama-with-local-fallback'?'Fictional restaurant · Model-assisted chat':'Fictional restaurant · Local chat';sessionStorage.setItem(savedKey,state.session_id);$('messages').replaceChildren();for(const message of state.messages){const div=document.createElement('div');div.className='message '+message.role;const label=document.createElement('small');label.textContent=message.role==='guest'?'You':'Your host';div.append(label,document.createTextNode(message.text));$('messages').append(div)}$('messages').append(review);$('review').classList.toggle('hidden',!state.can_confirm&&!state.receipt);$('review-draft').classList.toggle('hidden',!state.can_confirm);$('suggestions').classList.toggle('hidden',state.messages.length!==1);requestAnimationFrame(()=>{$('messages').scrollTop=$('messages').scrollHeight});$('draft').replaceChildren();for(const [key,label] of [['date','Evening'],['party_size','Guests'],['time','Seating'],['guest_name','Guest name'],['notes','Requests']]){const dt=document.createElement('dt');dt.textContent=label;const dd=document.createElement('dd');dd.textContent=state.draft[key]||'Not yet specified';$('draft').append(dt,dd)}$('confirm').classList.toggle('hidden',!state.can_confirm);$('receipt').classList.toggle('hidden',!state.receipt);$('code').textContent=state.receipt?.confirmation||'';controls()}
async function submitPending(){if(!pending||busy)return;busy=true;controls();status('');try{const result=await api(`/api/conversations/${encodeURIComponent(pending.session)}/turns`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(pending.body)});pending=null;sessionStorage.removeItem(pendingKey);$('message').value='';render(result);if($('auto-read').checked)readReply()}catch(error){if(error.definite){pending=null;sessionStorage.removeItem(pendingKey)}status(error.definite?error.message:'The response was interrupted. Retry the same request to safely check its outcome.',true)}finally{busy=false;controls()}}
function send(body){pending={session:state.session_id,body:{request_id:crypto.randomUUID(),...body}};sessionStorage.setItem(pendingKey,JSON.stringify(pending));submitPending()}
$('messages').append(review);
for(const chip of $('suggestions').querySelectorAll('button'))chip.onclick=()=>{if(!chip.disabled){$('message').value=chip.dataset.prompt;controls();$('message').focus()}};
$('message').addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();$('form').requestSubmit()}});
$('form').onsubmit=event=>{event.preventDefault();if(state&&!$('send').disabled&&$('message').value.trim())send({text:$('message').value.trim()})};$('confirm').onclick=()=>{if(state?.can_confirm&&!$('confirm').disabled)send({confirm_revision:state.revision})};$('retry').onclick=submitPending;
async function start(){busy=true;controls();try{render(await api('/api/conversations',{method:'POST'}));status('')}catch(error){status(error.message,true)}finally{busy=false;controls()}}
$('restart').onclick=()=>{if(!$('restart').disabled){voice.silence();$('message').value='';start()}};
(async()=>{busy=true;controls();try{const session=sessionStorage.getItem(savedKey);const savedPending=sessionStorage.getItem(pendingKey);if(session){render(await api(`/api/conversations/${encodeURIComponent(session)}`));if(savedPending){const candidate=JSON.parse(savedPending);if(candidate.session===session){pending=candidate;status('A previous request needs an outcome check. Use Retry last request.')}}}else{render(await api('/api/conversations',{method:'POST'}))}}catch(error){status(error.message+' Use New conversation to restart.',true)}finally{busy=false;controls()}})();
</script></body></html>
